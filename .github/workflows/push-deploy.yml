# Add build zip to GitHub releases.
# Version: 1.3.0

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  dist:
    name: "Build distribution release."
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max_old_space_size=8192
      release_status: stable

    steps:

      - name: "Checkout repository."
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Setup PHP."
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: "Get Composer cache directory."
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: "Cache Composer dependencies."
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "Install Composer dependencies."
        run: |
          composer install --no-interaction --prefer-dist --no-scripts

      - name: "Setup Node.js."
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: "Install NPM dependencies."
        run: |
          npm ci --no-audit --no-fund

      - name: "Get release metadata."
        run: |
          echo "release_tag=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "release_name=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: "Detect pre-release."
        run: |
          if [[ "${{ env.release_tag }}" == *"-alpha"* ]] || \
             [[ "${{ env.release_tag }}" == *"-beta"* ]] || \
             [[ "${{ env.release_tag }}" == *"-rc"* ]]; then
            echo "release_status=pre-release" >> $GITHUB_ENV
          fi

      - name: "Debug versions."
        run: |
          php --version
          composer --version
          node --version
          npm --version
          echo "Release tag: ${{ env.release_tag }}"
          echo "Release status: ${{ env.release_status }}"

      - name: "Build release."
        run: |
          npm run deploy

      - name: "Create GitHub release."
        uses: softprops/action-gh-release@v2
        with:
          files: ./deploy/${{ env.release_name }}-${{ env.release_tag }}.zip
          prerelease: ${{ env.release_status == 'pre-release' }}

      - name: "Deploy stable release to WordPress.org."
        if: env.release_status != 'pre-release'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ${{ env.release_name }}
          BUILD_DIR: ./build